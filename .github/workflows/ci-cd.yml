# .github/workflows/ci-cd.yml
name: ChemAI CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  PYTHON_VERSION: "3.11"
  POETRY_VERSION: "1.7.1"

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install Poetry
        run: pip install poetry==${{ env.POETRY_VERSION }}
      - name: Install dependencies
        run: poetry install --with dev
      - name: Lint with ruff
        run: poetry run ruff check . --output-format=github
      - name: Type check with mypy
        run: poetry run mypy backend/ frontend_streamlit/ --ignore-missing-imports
      - name: Run tests with pytest
        run: |
          poetry run pytest tests/ --cov=backend --cov-report=xml --cov-fail-under=85 -v
      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          fail_ci_if_error: true

  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        run: pip install pip-audit
      - name: Scan dependencies
        run: pip-audit --format=json --output=audit-report.json
      - name: Fail on critical/high vulnerabilities
        run: |
          jq -e '.vulnerabilities | length == 0' audit-report.json || \
          (echo "❌ Vulnerabilities found!" && exit 1)

  build-push:
    needs: [lint-test, security-scan]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push FastAPI image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: backend_fastapi/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}/chemai-api:${{ github.sha }}
      - name: Build and push Streamlit image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend_streamlit
          push: true
          tags: ghcr.io/${{ github.repository }}/chemlit-ui:${{ github.sha }}
