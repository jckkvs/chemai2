version: '3.8'

services:
  # ========== FastAPI Backend ==========
  fastapi:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: chemai-fastapi
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app/backend
      - ./data:/app/data
      - ./exports:/app/exports
      - chemai-cache:/app/.cache
    environment:
      - PYTHONPATH=/app
      - PYTHONUNBUFFERED=1
      - DEBUG=${DEBUG:-true}
      - HOST=0.0.0.0
      - PORT=8000
      - ALLOWED_ORIGINS=http://localhost:3000,http://frontend:3000
      - API_KEY=${API_KEY:-chemai-dev-key}
      - LOG_LEVEL=INFO
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - chemai-network

  # ========== Next.js Frontend ==========
  frontend:
    build:
      context: ./frontend_next
      dockerfile: Dockerfile
    container_name: chemai-frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend_next:/app
      - /app/node_modules
      - /app/.next
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - NODE_ENV=development
    depends_on:
      - fastapi
    restart: unless-stopped
    networks:
      - chemai-network

volumes:
  chemai-cache:

networks:
  chemai-network:
    driver: bridge
